      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-i686-linux-android.tar.gz
        sha256: bf9991c22811f56d6da8db576933d566cce0cf000a0a5e6a7ed0f6a6c4cc8bfa
        target_directory: rust-std/i686-linux-android
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-x86_64-linux-android.tar.gz
        sha256: 44e5a3da45c8be048c385ea9bd66127bba0db2caf9518afb2ef8d45988afffcf
