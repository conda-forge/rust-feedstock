      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-wasm32-unknown-emscripten.tar.gz
        sha256: d1f0e78494aefb5d3ee28d0732612d4ed42d2c0ab164be6db8e261944fb1d6f9
