      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-aarch64-linux-android.tar.gz
        sha256: 8913fbbad9d80136e0e9dec9865881a7d54119c28a9ac597eaebee1a7dfafad7
        target_directory: rust-std/aarch64-linux-android
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-arm-linux-androideabi.tar.gz
        sha256: 05dbffae11e8400442366120de2946766a4d1f43add37b3c18852dd57c5186da
        target_directory: rust-std/arm-linux-androideabi
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-armv7-linux-androideabi.tar.gz
        sha256: d07e85d6811d3abf31dfa76c3c47c3463173174479752cec8c19bcfad0005825
