      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-arm-linux-androideabi.tar.gz
        sha256: 8a0c84c37d83742bef657cefb37bb8a5be7fbacefd467bf30249d2c92ff72fa7
        target_directory: rust-std/arm-linux-androideabi
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-armv7-linux-androideabi.tar.gz
        sha256: 830f3630c0d871500c5ad243a634de7b1af3035a9e92d51e10b80446b77eac1c
