      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-thumbv7em-none-eabihf.tar.gz
        sha256: b6c6f3f722bf14d39b410af8dd91e09304ac9147fcf5f5f2b5d6cb04ec7ea7f2
