      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-thumbv8m.main-none-eabihf.tar.gz
        sha256: 0237ed4aadfb6b3261a0be9c94f588aec5d460bc54d7506c323f5850c8d84f1a
        target_directory: rust-std/thumbv8m.main-none-eabihf
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-x86_64-pc-windows-gnu.tar.gz
        sha256: 6546651238a3ac092b763511be524ca6eda6103e5d47342416923be1b3ce837c
        target_directory: rust-std/x86_64-pc-windows-gnu
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-wasm32-wasip1-threads.tar.gz
        sha256: d082481870457f063795510e20048eec65d765865c94ad01e7d5d8e07cb0c2ef
        target_directory: rust-std/wasm32-wasip1-threads
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-aarch64-pc-windows-msvc.tar.xz
        sha256: 044748841f47007a222dd5b3f5e9dacec1dae7386d7d308c5172d07ea7112fa0
        target_directory: rust-std/aarch64-pc-windows-msvc

build:
  number: ${{ build_number }}

outputs:
  - package:
      name: rust-std-${{ rust_arch }}
    build:
      noarch: generic
      dynamic_linking:
        binary_relocation: false
        missing_dso_allowlist:
          - if: linux
            then:
              - /lib64/librt.so.1
              - /lib64/libdl.so.2
              - /lib64/libpthread.so.0
              - /lib64/libm.so.6
              - /lib64/libc.so.6
              - /lib64/ld-linux-x86-64.so.2
      script:
        # Outputs have independent source trees/prefixes in v1. Prepare the
        # destdir in the same prefix as the component's installation script.
        content:
          - if: unix
            then:
              - bash "${RECIPE_DIR}/build.sh"
              - bash "${RECIPE_DIR}/install-rust-std.sh"
            else:
              - cmd /d /c call "%RECIPE_DIR%\build.bat"
              - call "%RECIPE_DIR%\install-rust-std.bat"
        env:
          rust_arch: ${{ rust_arch }}
    requirements:
      build:
        - if: build_platform == "win-64"
          then: m2-base
      run:
        # Windows and Unix have different directory structures.
        - if: unix
          then: __unix
          else: __win
      run_constraints:
        # Use explicit bounds to avoid a circular pin_subpackage dependency:
        # rust itself has an exact host dependency on this output.
        - rust >=${{ toolchain_version }},<${{ toolchain_upper_bound }}
    tests:
      - script:
          - if: unix
            then: test -d $PREFIX/lib/rustlib
            else: if not exist %LIBRARY_PREFIX%/lib/rustlib exit 1
          - echo ${{ rust_arch }}

  - package:
      name: rust
    build:
      dynamic_linking:
        # The distributed binaries are already relocatable.
        binary_relocation: false
        missing_dso_allowlist:
          - if: linux
            then:
              - /lib64/librt.so.1
              - /lib64/libdl.so.2
              - /lib64/libpthread.so.0
              - /lib64/libm.so.6
              - /lib64/libc.so.6
              - /lib64/ld-linux-x86-64.so.2
      script:
        content:
          - if: unix
            then:
              - bash "${RECIPE_DIR}/build.sh"
              - bash "${RECIPE_DIR}/install-rust.sh"
            else:
              - cmd /d /c call "%RECIPE_DIR%\build.bat"
              - call "%RECIPE_DIR%\install-rust.bat"
        env:
          rust_arch: ${{ rust_arch }}
    requirements:
      build:
        - if: build_platform == "win-64"
          then: m2-base
      host:
        - ${{ pin_subpackage("rust-std-" ~ rust_arch, exact=true) }}
        - if: linux
          then:
            # rustc needs a toolchain to link executables.
            - ${{ compiler('c') }}
            - ${{ stdlib('c') }}
            # zlib is linked by **/lib/libLLVM-*-rust-*.so.
            - zlib
      run:
        - ${{ pin_subpackage("rust-std-" ~ rust_arch, exact=true) }}
        - if: linux
          then:
            - gcc_impl_${{ target_platform }}
            - sysroot_${{ target_platform }} >=${{ c_stdlib_version }}
      run_exports:
        strong_constraints:
          - if: osx and x86_64
            then: __osx >=${{ c_stdlib_version }}
          - if: linux
            then: __glibc >=${{ c_stdlib_version }}
    tests:
      - requirements:
          run:
            - if: build_platform == "win-64"
              then: m2-base
        script:
          - rustc --help
          - rustdoc --help
          - cargo --help
          - rustc --version
          - if: unix
            then: rustc --version | grep "rustc ${{ version }}"
          - cargo --config registries.crates-io.protocol=\"sparse\" install --force xsv
          - echo ${{ rust_arch }}
          # Documentation is provided by rust-docs, not rust.
          - if: unix
            then:
              - test ! -d "${PREFIX}"/share/doc/rust/html
              - test ! -d "${PREFIX}"/share/doc/rust/json
              - test ! -f "${PREFIX}"/bin/rust-analyzer
            else:
              - if exist %LIBRARY_PREFIX%\share\doc\rust\html exit 1
              - if exist %LIBRARY_PREFIX%\share\doc\rust\json exit 1
              - if exist %LIBRARY_PREFIX%\bin\rust-analyzer.exe exit 1
              - if exist %LIBRARY_PREFIX%\bin\rust-analyzer.pdb exit 1

  - package:
      name: rust-src
    build:
      skip: rust_arch not in ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
      noarch: generic
      string: ${{ "win" if "windows" in rust_arch else "unix" }}_${{ build_number }}
      script: install-rust-src
    requirements:
      build:
        - if: win
          then: m2-base
      run:
        - if: win
          then: __win
          else: __unix
      run_constraints:
        # rust-src is specific to the toolchain, just as in rustup.
        - rust >=${{ toolchain_version }},<${{ toolchain_upper_bound }}
    tests:
      - script:
          - if: unix
            then:
              - test -f "${PREFIX}"/lib/rustlib/src/rust/library/Cargo.lock
              # Do not clobber other Rust components.
              - test "$(ls "${PREFIX}"/lib/rustlib/)" = "$(printf "manifest-rust-src\nsrc")"
            else:
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/src/rust/library/Cargo.lock" exit 1
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/manifest-rust-src" exit 1
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/src" exit 1

  - package:
      name: rust-std-${{ rust_std_extra }}
    build:
      skip: rust_arch not in ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
      noarch: generic
      string: ${{ "win" if "windows" in rust_arch else "unix" }}_${{ build_number }}
      script:
        file: install-rust-std-extra
        env:
          rust_std_extra: ${{ rust_std_extra }}
    requirements:
      build:
        - if: win
          then: m2-base
      run:
        - if: win
          then: __win
          else: __unix
      run_constraints:
        - rust >=${{ toolchain_version }},<${{ toolchain_upper_bound }}
    tests:
      - script:
          - if: unix
            then:
              - test -d $PREFIX/lib/rustlib/${{ rust_std_extra }}
              - test -f $PREFIX/lib/rustlib/manifest-rust-std-${{ rust_std_extra }}
              # Do not clobber other Rust components.
              - test -z "$(ls "${PREFIX}"/lib/rustlib/ | grep -v ${{ rust_std_extra }})"
            else:
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/${{ rust_std_extra }}" exit 1
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/manifest-rust-std-${{ rust_std_extra }}" exit 1
              - dir /b "%LIBRARY_PREFIX%" | findstr /v "${{ rust_std_extra }}" >nul || exit 1
          - echo ${{ rust_std_extra }}

  - package:
      name: rust-docs
    build:
      skip: rust_arch not in ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
      noarch: generic
      string: ${{ "win" if "windows" in rust_arch else "unix" }}_${{ build_number }}
      script:
        content:
          - if: unix
            then:
              - bash "${RECIPE_DIR}/build.sh"
              - bash "${RECIPE_DIR}/install-rust-docs.sh"
            else:
              - cmd /d /c call "%RECIPE_DIR%\build.bat"
              - call "%RECIPE_DIR%\install-rust-docs.bat"
    requirements:
      build:
        - if: win
          then: m2-base
      run:
        - if: win
          then: __win
          else: __unix
      run_constraints:
        - rust >=${{ toolchain_version }},<${{ toolchain_upper_bound }}
    tests:
      - script:
          - if: unix
            then:
              - test -d "${PREFIX}"/share/doc/rust/html
              - test -d "${PREFIX}"/share/doc/rust/json
              - test -f "${PREFIX}"/lib/rustlib/manifest-rust-docs
              - test -f "${PREFIX}"/lib/rustlib/manifest-rust-docs-json-preview
            else:
              - if not exist "%LIBRARY_PREFIX%/share/doc/rust/html" exit 1
              - if not exist "%LIBRARY_PREFIX%/share/doc/rust/json" exit 1
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/manifest-rust-docs" exit 1
              - if not exist "%LIBRARY_PREFIX%/lib/rustlib/manifest-rust-docs-json-preview" exit 1

about:
  homepage: https://www.rust-lang.org
  license: MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
  summary: |
    Rust is a systems programming language that runs blazingly fast, prevents segfaults, and guarantees thread safety.
    This package provides the compiler (rustc) and the documentation utilities rustdoc.
  repository: https://doc.rust-lang.org/std/
  documentation: https://www.rust-lang.org/en-US/documentation.html

extra:
  feedstock-name: rust
  recipe-maintainers:
    - timkpaine
    - xhochy
    - johanneskoester
    - abhi18av
    - pkgw
    - dlaehnemann
    - isuruf
    - mbargull
