    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-aarch64-unknown-linux-gnu.tar.xz
      sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "riscv64gc-unknown-linux-gnu"
    then:
