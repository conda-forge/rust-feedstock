      sha256: e44fa9fbb3df4324e418204e20e3d4f2f7834c0781c23275bc78d3e121940f70
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "powerpc64le-unknown-linux-gnu"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-powerpc64le-unknown-linux-gnu.tar.gz
      sha256: 2db292783506bf29b465fd73f7e4c09445d533ef2a6897c5407463f39048e22e
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "x86_64-apple-darwin"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-x86_64-apple-darwin.tar.gz
      sha256: 596756101bf43cd335fb247f5cc9ede0c157245523baff25a66694682495cfcb
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "aarch64-apple-darwin"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-aarch64-apple-darwin.tar.gz
      sha256: f35e7c5b2cf63e67c075d323e4d6b87501219311f09744ab24caecb761c96643
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "x86_64-pc-windows-msvc"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-x86_64-pc-windows-msvc.tar.gz
      sha256: d8c21157e70d86c6e861d57d9c191a79f47b940b4fcd48c29440b2f4a3c8aa51
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "aarch64-pc-windows-msvc"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-aarch64-pc-windows-msvc.tar.gz
      sha256: fe66ed39bcd10e368b4e8608e44d1a991547e741672138721f7745c45f60ae74
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - url: https://static.rust-lang.org/dist/rust-src-${{ version }}.tar.gz
    sha256: 82b978093b33c71bcbe69005b92181bfb76d3d0e434ef303e637812e21badcd7
    target_directory: rust-src
  - if: rust_arch in ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
    then:
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-aarch64-apple-ios.tar.gz
        sha256: d13203ad014c92c6c529ab52969becaa55f24b93fc95adf1bc056cfe40a3970d
        target_directory: rust-std/aarch64-apple-ios
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-x86_64-apple-ios.tar.gz
        sha256: 4fa58d369c3a364db5a0a19713ceaae0121bd0c2846abf22e25e3969f7b07de1
        target_directory: rust-std/x86_64-apple-ios
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-x86_64-pc-windows-msvc.tar.gz
        sha256: 0f755f2339d6fcb97da532cde33566350e9690398a0fdd06fba8fc281e0bd6dc
        target_directory: rust-std/x86_64-pc-windows-msvc
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-aarch64-apple-ios-sim.tar.gz
        sha256: 7970667242488111abfbd42e8eb095de0863c14729b42e9b8dad0e0ea636d324
