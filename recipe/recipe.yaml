      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-i686-linux-android.tar.gz
        sha256: 79ea7bacc961dbdc1fe0f61eb302105da89e34ae1ee52d99a34eb4d2f1d2520a
        target_directory: rust-std/i686-linux-android
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-x86_64-linux-android.tar.gz
        sha256: a8e237d1546e71739709376acc34991521b3a387a311dd68634d5cc56f526ca3
        target_directory: rust-std/x86_64-linux-android
      - url: https://static.rust-lang.org/dist/rust-std-${{ version }}-wasm32-unknown-unknown.tar.gz
        sha256: 4dffdca3c11a88f18a35021cea4ed0279b41650c0e3e2e98928ecc28958bceba
