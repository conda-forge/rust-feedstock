schema_version: 1

context:
  version: "1.99.0"
  build_number: 0
  toolchain_version: ${{ version }}
  toolchain_upper_bound: ${{ (version | split('.'))[0] }}.${{ (version | split('.'))[1] }}.${{ ((version | split('.'))[2] | int) + 1 }}.0a0

recipe:
  name: rust-split
  version: ${{ toolchain_version }}


source:
  # Select archives by the Rust target triple, not the build machine's
  # platform: rust-std is noarch but contains target-specific libraries.
  - if: rust_arch == "x86_64-unknown-linux-gnu"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-x86_64-unknown-linux-gnu.tar.gz
      sha256: de0581ca9d732295a6474cfbd02461db27d69acd5050a8206523a8d6fa1599db
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "aarch64-unknown-linux-gnu"
    then:
      url: https://static.rust-lang.org/dist/rust-${{ version }}-aarch64-unknown-linux-gnu.tar.xz
      sha256: 5a30ce742be0835d9b23fc862db5cbbbc71464e1c9b1fca22917e10e4ba32a92
      patches:
        - 0001-gh-106-install.sh-Perfomance-Use-more-shell-builtins.diff
  - if: rust_arch == "riscv64gc-unknown-linux-gnu"
    then:
